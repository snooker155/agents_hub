# Example requests shown in the empty chat with this agent, by UI language.
en:
- Create tasks from this project's process view
- Build a task plan from the architecture
- Break this project down into actionable tasks and sequence them
- Update the plan to cover the new components on the canvas
- Which tasks are blocked, and by what?
- What is on the critical path of this plan?
ru:
- Создай задачи по схеме процесса этого проекта
- Составь план задач по архитектуре
- Разбей проект на конкретные задачи и выстрой их по порядку
- Обнови план, чтобы он покрывал новые компоненты на холсте
- Какие задачи заблокированы и чем?
- Что лежит на критическом пути этого плана?
de:
- Leg Aufgaben aus der Prozessansicht dieses Projekts an
- Erstelle einen Aufgabenplan aus der Architektur
- Zerlege das Projekt in umsetzbare Aufgaben und bring sie in eine Reihenfolge
- Aktualisiere den Plan, damit er die neuen Komponenten auf der Arbeitsfläche abdeckt
- Welche Aufgaben sind blockiert, und wodurch?
- Was liegt auf dem kritischen Pfad dieses Plans?
