# Example requests shown in the empty chat with this agent, by UI language.
en:
- 'Take the oldest open system task marked code: yes and fix it'
- Fix the issue in this system task and add a test for it
- Prepare a patch on a branch for the failing health check
- Which system tasks can you fix with code, and which need a person?
- Review the suggested fix in this system task before applying it
- Show me the branch and diff for the last system task
