rag:
  enabled: true
  top_k: 8
  min_score: 0.15
  max_context_items: 10

vector_store:
  backend: "inmemory"     # inmemory|faiss
  dim: 8                  # размерность эмбеддингов (заглушка)
  index_path: "./data/vector.index"   # для FAISS (когда подключишь)
  normalize: true

graph_store:
  backend: "inmemory"     # inmemory|neo4j
  uri: "bolt://localhost:7687"
  user: "neo4j"
  password: "neo4j"
  database: "neo4j"

prompts:
  # В каркасе LLM не обязателен. Если включишь — тут хранить шаблоны.
  intent_system: |
    You are an intent classifier. Output JSON only.
  intent_fewshot: []
