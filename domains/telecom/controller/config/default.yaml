app:
  name: "an-agent"
  environment: "dev"   # dev|test|prod
  log_level: "INFO"    # DEBUG|INFO|WARNING|ERROR

coordinator:
  tick_hz: 100                 # частота реактивного цикла (если идём по тикам)
  reactive_deadline_ms: 10     # дедлайн hot path
  proactive_tick_hz: 2         # медленный цикл (или event-driven + периодика)
  enable_proactive: true

runtimes:
  reactive:
    enabled: true
    enable_rag: true          # RAG можно отключать по дедлайну
    enable_llm: false         # LLM в reactive по умолчанию запрещён
  proactive:
    enabled: true
    enable_llm: false         # включай только если реально подключишь провайдера
    schedule:
      periodic_check_sec: 5   # scheduler: периодический self-check

interfaces:
  telemetry:
    adapter: "mock"           # mock|ran (в будущем)
    poll_interval_ms: 5
  southbound:
    driver: "mock"            # mock|e2|odi|tr069

storage:
  relational:
    url: "sqlite:///./data/an_agent.db"
  artifacts_dir: "./data/artifacts"
