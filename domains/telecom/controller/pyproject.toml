[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "an-agent"
version = "0.1.0"
description = "AN Agent (Sifakis) architecture skeleton: coordinator + reactive/proactive runtimes + hybrid knowledge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Your Name", email = "you@example.com" }
]
keywords = ["agents", "rag", "control", "rl", "telecom", "ran", "knowledge-graph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]

dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scipy>=1.12",
  "networkx>=3.2",
  "tenacity>=8.2",
  "rich>=13.7",
  "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.8",
  "ruff>=0.4",
  "black>=24.0",
  "types-PyYAML>=6.0.12.20240311",
]

ml = [
  "torch>=2.2",
]

vector = [
  "faiss-cpu>=1.8.0",
]

graph = [
  "neo4j>=5.18",
]

[project.scripts]
an-agent-offline = "experiments.ran_la_agent.run_offline:main"
an-agent-online = "experiments.ran_la_agent.run_online:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = [
  "an_agent_core*",
  "runtimes*",
  "knowledge*",
  "models*",
  "planning*",
  "interfaces*",
  "experiments*",
  "tests*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
