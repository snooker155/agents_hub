# Builds site/ (landing page + the docs/ corpus) and publishes it to GitHub Pages.
#
# Requires one manual step, once: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Publishing from a branch would hand docs/ to Jekyll
# instead, which is not what that folder is.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # VitePress reads git history to show a "last updated" per page.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site through the API if it does not exist yet,
          # so a fresh clone or a fork does not have to enable it by hand first.
          enablement: true

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        # Also copies docs/*.md into site/guide/ and fails if the corpus and
        # docs/index.json disagree.
        working-directory: site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
