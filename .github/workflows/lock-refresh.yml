name: Lock refresh

# Once a week, re-resolve requirements.lock to the newest versions the ranged
# requirement files allow, run the suite on it, and open a PR to dev when
# anything moved. Dependabot does not read a uv lock (.github/dependabot.yml).
#
# A PR opened with GITHUB_TOKEN does not start other workflows, so the suite
# runs here, before the PR exists. The repository setting "Allow GitHub
# Actions to create and approve pull requests" must be on.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Re-resolve the lock
        run: scripts/refresh_lock.sh --upgrade

      - name: Anything moved?
        id: diff
        run: |
          if git diff --quiet requirements.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff requirements.lock | grep -E '^[-+][a-zA-Z]' > "$RUNNER_TEMP/moved.txt" || true
          fi

      - name: Install the new lock
        if: steps.diff.outputs.changed == 'true'
        run: |
          pip install -r requirements.lock
          pip install pytest pytest-xdist pip-audit

      - name: Run tests
        if: steps.diff.outputs.changed == 'true'
        env:
          AGENTS_HUB_ROOT: ${{ runner.temp }}/agents_hub_ci
        run: python -m pytest tests/ -q -n auto

      - name: Known vulnerabilities
        if: steps.diff.outputs.changed == 'true'
        run: python scripts/ci/audit_lock.py

      - name: Open the PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          base: dev
          branch: chore/lock-refresh
          delete-branch: true
          add-paths: requirements.lock
          commit-message: "Dependencies: weekly refresh of requirements.lock"
          title: "Dependencies: weekly refresh of requirements.lock"
          body-path: ${{ runner.temp }}/moved.txt
          labels: dependencies
