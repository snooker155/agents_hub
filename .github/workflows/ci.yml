name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Backend + agent deps carry the store/runtime libraries the tests import.
          pip install -r dashboard/backend/requirements.txt
          pip install -r requirements-agents.txt
          # The CLI's own deps: tests/test_cli_*.py import typer's CliRunner and
          # go through cli.main, which reaches for rich and requests as well.
          pip install -r requirements-cli.txt
          pip install pytest ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        # AGENTS_HUB_ROOT is also set to a throwaway dir by tests/conftest.py; this
        # is belt-and-braces so nothing can touch a real state directory on CI.
        env:
          AGENTS_HUB_ROOT: ${{ runner.temp }}/agents_hub_ci
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            npx eslint .
          fi

      - name: Test
        # Workers hung intermittently when files ran in parallel on the CI
        # runner; one worker at a time is slower but finishes every time.
        run: npx vitest run --fileParallelism=false

      - name: Build
        run: npx vite build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          build-args: |
            WITH_RAG=false
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: dashboard/frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
