# Dependency updates. Every PR targets dev, where work happens; main only
# receives releases (CONTRIBUTING.md, "Branches").
#
# Python is not here: requirements.lock is a uv resolution of ranged
# requirement files, which Dependabot does not read. The weekly
# lock-refresh workflow re-resolves it instead, and CI audits it on every push.
version: 2
updates:
  - package-ecosystem: npm
    directory: /dashboard/frontend
    target-branch: dev
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    # A package goes to the first group it matches.
    groups:
      # vite, vitest and their plugins only resolve at matching majors: a lone
      # @vitest/coverage-v8 5 against vitest 3 fails npm ci.
      build-and-test:
        patterns: ["vite", "vitest", "@vitest/*", "@vitejs/*"]
      # Lint plugins add rules in minor releases (react-hooks 7.1 brought the
      # React Compiler rules, 226 findings), so they move on their own and do
      # not hold the rest back.
      lint:
        patterns: ["eslint", "eslint-*", "@eslint/*", "globals"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: [/clients/agents-hub-ts, /clients/agents-hub-langgraph-js, /site]
    target-branch: dev
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/, /dashboard/frontend, /deploy/models, /deploy/browser]
    target-branch: dev
    schedule: { interval: monthly }
    ignore:
      # Node majors move by hand, to the next LTS line; Dependabot offers
      # odd, short-lived releases (25) as well.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
