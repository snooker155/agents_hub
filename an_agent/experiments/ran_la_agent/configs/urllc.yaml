# Экспериментальный конфиг: режим URLLC (reliability-first)

coordinator:
  tick_hz: 100
  reactive_deadline_ms: 10
  proactive_tick_hz: 2
  enable_proactive: true

runtimes:
  reactive:
    enabled: true
    enable_rag: true
    enable_llm: false
  proactive:
    enabled: true
    enable_llm: false
    schedule:
      periodic_check_sec: 5

interfaces:
  telemetry:
    adapter: "mock"
    poll_interval_ms: 5
  southbound:
    driver: "mock"

storage:
  relational:
    url: "sqlite:///./data/an_agent.db"

rag:
  enabled: true
  top_k: 8
  min_score: 0.15
  max_context_items: 10

vector_store:
  backend: "inmemory"
  dim: 8
  normalize: true

graph_store:
  backend: "inmemory"

models:
  situation_awareness:
    sinr_kalman:
      enabled: true
      process_var: 1.0e-3
      meas_var: 1.0e-2
    smoothing:
      window: 20
    bler_lstm:
      enabled: false
      history_ttis: 100
      horizon_ttis: 5

  policy:
    goal_mlp:
      enabled: true
      temperature: 1.0
    dqn:
      enabled: false

  reward_shaping:
    mode: "urllc"
    embb:
      max_bler: 0.10
      w_tpt: 1.0
      w_bler: -0.5
    urllc:
      max_bler: 0.001
      w_bler: -2.0
      w_tpt: 0.2

safety:
  deadlines:
    reactive_ms: 10
    proactive_ms: 200
  constraints:
    mcs:
      min_index: 0
      max_index: 27
      max_step: 2
    mimo_rank:
      allowed: [1, 2, 4]
    bler:
      embb_max: 0.10
      urllc_max: 0.001
  fallback:
    on_deadline_exceeded: "rules_only"
    disable_rag_if_late: true
