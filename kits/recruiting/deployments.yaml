# A weekly pipeline digest. Starts paused: turn it on once a role's
# requirements and criteria are in the recruiting notes pool.
kind: deployment
id: weekly-pipeline-digest
title: Weekly recruiting pipeline digest
agent: recruiting_screener
message: >
  Summarize this week's pipeline: how many candidates Sourcer found, how
  many were screened, how many advanced to an interview and how many were
  declined, each with its reason. Flag anything stalled for more than a
  few days.
recurrence: weekly
run_at: 2026-10-10T09:00:00+00:00
timezone: UTC
paused: true
