[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-hub"
version = "0.1.0"
description = "Agents Hub — agents, tasks and workspaces, from a terminal or a dashboard"
readme = "README.md"
requires-python = ">=3.10"

# Only what the terminal client itself needs. Direct mode (the default) also
# needs the service's own dependencies, which are extras below rather than
# requirements here: installing the CLI should not pull a model runtime onto a
# machine that only ever talks to a backend over AGENTS_HUB_URL.
dependencies = [
    "typer",
    "rich",
    "requests",
]

# Read from the requirement files that already exist, so there is one place to
# edit: pip install -e ".[backend,agents]" for a full in-process service.
dynamic = ["optional-dependencies"]

[project.scripts]
# `ah` is the one to type; the long name stays for scripts, and for anyone whose
# shell already means something else by `ah`.
ah = "agents_hub:main"
agents-hub = "agents_hub:main"

[tool.setuptools]
# One package, and only one. The service's own modules stay out of site-packages
# because their names are the generic ones — `agents` is the OpenAI SDK, `tasks`
# and `tools` belong to several distributions — and shadowing in either
# direction is a debugging session nobody asked for. `cli` is in that set too:
# `agents_hub.main` puts the checkout on sys.path and imports `cli.main` from
# there, which is also where the service reads its definitions, seed catalog and
# state root from.
#
# Install it editable (`pip install -e .`): the command then follows the
# checkout, including `git pull`, instead of freezing a copy of it.
packages = ["agents_hub"]

[tool.setuptools.dynamic.optional-dependencies]
backend = { file = ["dashboard/backend/requirements.txt"] }
agents = { file = ["requirements-agents.txt"] }
rag = { file = ["requirements-rag.txt"] }
# Postgres driver, for AGENTS_HUB_DATABASE_URL=postgresql://... (docs/scaling.md).
postgres = { file = ["requirements-postgres.txt"] }
# The playground (simulation worlds/scenarios) needs nothing beyond backend/
# agents already installs; this extra is a marker, not a dependency source —
# PLAYGROUND_ENABLED is what actually makes the feature optional at runtime.
# See requirements-playground.txt and docs/playground.md.
playground = { file = ["requirements-playground.txt"] }

[tool.ruff]
target-version = "py310"
# Generated/vendored/build output, and the frontend (its own ESLint config
# covers it) — none of this is code we lint with ruff.
exclude = ["node_modules", "chroma_db", "site", "dashboard/frontend", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    # E402 (module-import-not-at-top): a large share of the hits are entrypoints
    # and scripts that deliberately manipulate sys.path before importing local
    # modules. Baseline ignore for now; revisit once those entrypoints are
    # restructured to not need it.
    "E402",
    # E741 (ambiguous variable name, e.g. `l`/`I`/`O`): pre-existing short names
    # throughout the codebase, mostly loop variables and math-y code. Baseline
    # ignore for now; revisit as a separate rename pass.
    "E741",
]
