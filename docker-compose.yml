services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    command:
      - python
      - -m
      - uvicorn
      - dashboard.backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      AGENT_EXECUTION_MODE: local
      ALLOW_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "5173"
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/dashboard/frontend/node_modules
    working_dir: /app/dashboard/frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  frontend_node_modules:
