# Agents Hub for one person on their own machine: the backend, the dashboard
# and, with `--profile browser`, the agents' browser service.
#   docker compose up --build
#
# The API has no login in this edition, so both published ports listen on
# 127.0.0.1 by default. Set HUB_BIND in .env only to an address of a network
# you alone can reach.

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
    target: backend
    args:
      # The RAG extras (torch, sentence-transformers, chromadb, the remote
      # vector stores) are a gigabyte of wheels; the image leaves them out
      # unless WITH_RAG=true is in .env (docs/memory.md).
      WITH_RAG: ${WITH_RAG:-false}
  env_file:
    # Optional so a fresh clone comes up without one; copy .env.example to
    # .env to supply provider keys.
    - path: .env
      required: false
  volumes:
    - .:/app
    # Lets this container drive the host daemon to build agent images and run
    # agent containers. Drop this line to forbid that outright: with it
    # mounted, anything running in this container has host-root-equivalent
    # access to the daemon. Without it, set AGENT_EXECUTION_MODE=local.
    - /var/run/docker.sock:/var/run/docker.sock
    # ---- Named volume for .agents_hub: opt-in only, read this first ----
    # It is tempting to replace the whole-repo bind mount above with a named
    # volume for just the state directory, so state does not sit inside the
    # checkout on the host. Do NOT do this: managers/container_manager.py
    # bind-mounts .agents_hub/workspaces/<name> (and .agents_hub itself, and
    # tasks/) into each agent container, and it resolves the host side of
    # that mount by rebasing the in-container path onto HOST_PROJECT_ROOT
    # (see the env var below), i.e. it assumes .agents_hub lives at a real
    # path under the repo checkout on the host. A named volume's data lives
    # in Docker's own volume storage instead, so that rebased path would not
    # exist on the host, and every agent container's workspace/state mount
    # would silently point at an empty directory instead of the real state.
    # If you still want state off the host checkout, the correct opt-in
    # change is to also point AGENTS_HUB_ROOT (see common/paths.py) at a host
    # directory outside the repo and mount that directory here and as
    # HOST_PROJECT_ROOT's sibling, e.g.:
    #   environment:
    #     AGENTS_HUB_ROOT: /data/agents_hub
    #   volumes:
    #     - ${AGENTS_HUB_DATA_DIR:-./.agents_hub}:/data/agents_hub
    # keeping it a bind mount (not a named volume) so the rebasing above
    # still finds a real host path.
  # The image runs as a non-root user (hub, uid 1000), so it needs to be in
  # the socket's group to use the mounted /var/run/docker.sock above. Find
  # the group id as the container sees it: `docker compose run --rm --no-deps
  # backend ls -ln /var/run/docker.sock` (often 999 or 998 on Linux; on macOS
  # with Docker Desktop the socket inside the VM is root:root, mode 660, so
  # DOCKER_GID=0 is required there, verified 2026-09-22) and set DOCKER_GID
  # in .env if it differs from the default below. Harmless to leave in place
  # when the socket line above is removed: it just adds an unused
  # supplementary group.
  group_add:
    - "${DOCKER_GID:-999}"
  working_dir: /app
  extra_hosts:
    # So LM Studio / Ollama on the host stay reachable on plain Linux Docker
    # too, where this alias is not provided for us.
    - "host.docker.internal:host-gateway"
  # `default` is the network every other service is on; `browser_net` is the
  # one the `browser` service lives on alone, so the backend can reach it and
  # it can reach nothing else of ours (see that service below).
  networks:
    - default
    - browser_net

services:
  backend:
    <<: *backend
    # No --reload. The repository is bind-mounted below, so a reloader would
    # watch the whole tree, state directories included, and restart the backend
    # on writes it makes itself. `docker compose restart backend` picks up code.
    command:
      - python
      - -m
      - uvicorn
      - dashboard.backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      PYTHONPATH: /app
      # The host path mounted at /app. Bind mounts for agent containers are
      # resolved by the daemon, which knows nothing about this container's
      # filesystem, so managers/container_manager.py rebases paths onto this.
      HOST_PROJECT_ROOT: ${HOST_PROJECT_ROOT:-$PWD}
      # Nothing else is pinned here on purpose: values set in this block
      # override .env, so AGENT_EXECUTION_MODE (local | docker), ALLOW_ORIGINS
      # and the provider settings all stay where you edit them, in .env.
    ports:
      - "${HUB_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"

  # Dashboard: the built bundle behind nginx, which also proxies /api.
  # The bundle is baked into the image, so a source change needs a rebuild of
  # this service. For an HMR loop, run Vite on the host instead:
  #   cd dashboard/frontend && npm run dev
  frontend:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
      target: nginx
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HUB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    environment:
      BACKEND_SERVERS: ${BACKEND_SERVERS:-backend:8000}
      # Shared cache TTL for generated view assets. 0 turns it off.
      API_ASSET_CACHE_SECONDS: ${API_ASSET_CACHE_SECONDS:-30}

  # Headless Chromium for the browser_* tools (tools/browser.py,
  # deploy/browser/). Under the `browser` profile, so a plain `docker compose
  # up` never builds or starts it:
  #   docker compose --profile browser up --build
  # .env needs, for the backend to use it:
  #   AGENTS_HUB_BROWSER_URL=http://browser:3000
  #   AGENTS_HUB_BROWSER_TOKEN=<a long random string>
  # The service refuses to start without the token, and requires it on every
  # call. No port is published: only the backend reaches it.
  #
  # Network isolation: the service sits alone on `browser_net`, which the
  # backend services also join. Docker keeps separate bridge networks apart,
  # so a page cannot reach the backend or anything else on the
  # `default` network, not even by IP. What compose cannot express is "the
  # internet but not the host's LAN": that part is the service's own check,
  # which refuses every request (subresources and redirect hops included) to
  # a loopback, private, link-local or metadata address. For a hard guarantee
  # add an egress firewall rule for this network on the host.
  browser:
    build:
      context: .
      dockerfile: deploy/browser/Dockerfile
    profiles:
      - browser
    environment:
      BROWSER_TOKEN: ${AGENTS_HUB_BROWSER_TOKEN:-}
      BROWSER_MAX_SESSIONS: ${BROWSER_MAX_SESSIONS:-8}
      BROWSER_IDLE_TIMEOUT: ${BROWSER_IDLE_TIMEOUT:-300}
    networks:
      - browser_net
    init: true
    # Chromium uses /dev/shm heavily; Docker's 64 MB default crashes tabs.
    shm_size: "1gb"
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  browser_net:
    driver: bridge
