# The `worker` role (docs/workers.md): claims launches from the queue and
# spawns them on this pod. No liveness/readiness HTTP probe, since a worker
# serves no HTTP; the exec probe below only checks the process is still
# interpretable Python, which is a weak signal but better than none, since a
# crashed or wedged container should still be restarted by the kubelet.
#
# No Docker socket here: see the note on worker.workerModes in values.yaml.
# AGENTS_HUB_WORKER_MODES=local means this pod is never handed a launch that
# wants a container, only ones that run as a local subprocess.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agents-hub.fullname" . }}-worker
  labels:
    {{- include "agents-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "runtime.worker"]
          envFrom:
            - configMapRef:
                name: {{ include "agents-hub.fullname" . }}-config
            - secretRef:
                name: {{ include "agents-hub.fullname" . }}-secret
          env:
            - name: AGENTS_HUB_ROLE
              value: worker
            - name: AGENTS_HUB_WORKER_MODES
              value: {{ .Values.worker.workerModes | quote }}
            - name: AGENTS_HUB_WORKER_CONCURRENCY
              value: {{ .Values.worker.workerConcurrency | quote }}
          livenessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: state
              mountPath: /data/agents_hub
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "agents-hub.fullname" . }}-state
        {{- end }}
