# The dashboard: the built bundle behind nginx (dashboard/frontend/Dockerfile,
# target: nginx), proxying /api and balancing it over the backend Service
# below by its cluster DNS name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agents-hub.fullname" . }}-frontend
  labels:
    {{- include "agents-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            # Cluster-DNS name of the backend Service, load balanced by
            # Kubernetes itself across every backend pod; nginx does not need
            # to know the replica count.
            - name: BACKEND_SERVERS
              value: "{{ include "agents-hub.fullname" . }}-backend:{{ .Values.backend.service.port }}"
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
