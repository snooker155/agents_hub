# Every value defaults to "" in values.yaml, so an install with nothing set
# still renders a valid (empty-valued) Secret rather than failing; fill the
# real values with --set or a values file you keep out of version control
# (README.md).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-hub.fullname" . }}-secret
  labels:
    {{- include "agents-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
