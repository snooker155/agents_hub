# Alert rules for a Prometheus that scrapes GET /metrics (common/metrics.py,
# docs/slo.md). Load with `rule_files: ["alerts.yml"]` in prometheus.yml, or
# via a PrometheusRule CRD if the operator manages this cluster — see
# deploy/helm/agents-hub/templates/prometheusrule.yaml, which mirrors these
# two rules for that path (kept off by default: prometheusRule.enabled).
#
# The hub also raises these same two conditions as its own notifications
# (notify/rules.py's slo_start_latency / slo_error_rate alert rules,
# evaluated from the plan scheduler tick) so an operator without Prometheus
# still hears about a breach through the dashboard's own channels. This file
# is for the operator who already runs Prometheus and wants the same signal
# in Alertmanager.
groups:
  - name: agents-hub-slo
    rules:
      - alert: AgentsHubRunStartSLOBreach
        # agents_hub_slo_breach is only published once a window holds enough
        # data to judge (common/slo.py MIN_ERROR_SAMPLE and the p95 sample
        # itself); `== 1` alone, with no `unless absent(...)`, correctly
        # stays silent rather than false-alarming on a quiet deployment.
        expr: agents_hub_slo_breach{objective="start_p95"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agents Hub: run start time p95 is over its SLO"
          description: >-
            agents_hub_run_start_seconds (p95) has been over
            AGENTS_HUB_SLO_START_P95_SECONDS for at least 5 minutes. See
            docs/runbook.md and docs/slo.md.

      - alert: AgentsHubErrorRateSLOBreach
        expr: agents_hub_slo_breach{objective="error_rate"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agents Hub: run error rate is over its SLO"
          description: >-
            The share of finished runs that failed has been over
            AGENTS_HUB_SLO_ERROR_RATE for at least 5 minutes. See
            docs/runbook.md and docs/slo.md.

      - alert: AgentsHubDatabaseDown
        expr: agents_hub_database_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Agents Hub: the database has not answered a trivial query in 2m"
          description: "See docs/runbook.md, 'Database locked or Postgres unreachable'."

  # The operator metrics (docs/observability.md). Counters restart from zero
  # with the process, which rate() and increase() handle.
  - name: agents-hub-operations
    rules:
      - alert: AgentsHubScrapeDown
        expr: up{job=~".*agents.hub.*"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Agents Hub: /metrics has not been scraped successfully for 5m"
          description: "See docs/observability.md and docs/runbook.md."

      - alert: AgentsHubAgentFailing
        # More than half of an agent's finished runs failed in the last hour,
        # with enough runs to mean something.
        expr: >-
          (sum by (agent) (increase(agents_hub_runs_finished_total{status=~"failed|error"}[1h]))
            / sum by (agent) (increase(agents_hub_runs_finished_total[1h]))) > 0.5
          and sum by (agent) (increase(agents_hub_runs_finished_total[1h])) >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Agents Hub: agent {{ $labels.agent }} fails more than half of its runs"
          description: "Look at the agent's recent runs and logs. See docs/runbook.md."

      - alert: AgentsHubRunsSlow
        expr: >-
          histogram_quantile(0.95, sum by (le) (rate(agents_hub_run_duration_seconds_bucket[30m]))) > 600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Agents Hub: the 95th percentile of run duration is over 10 minutes"
          description: "See docs/observability.md, then the slowest agents and models on the Costs page."

      - alert: AgentsHubToolErrors
        expr: >-
          sum by (tool) (increase(agents_hub_tool_calls_total{status="error"}[1h])) >= 10
          and (sum by (tool) (increase(agents_hub_tool_calls_total{status="error"}[1h]))
            / sum by (tool) (increase(agents_hub_tool_calls_total[1h]))) > 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Agents Hub: tool {{ $labels.tool }} fails more than half of its calls"
          description: "A connector or key behind the tool may be broken. See docs/observability.md."

      - alert: AgentsHubSpendSpike
        # An hour's estimated spend over three times the average hour of the
        # previous day, and over one USD.
        expr: >-
          sum(increase(agents_hub_model_cost_usd_total[1h])) > 1
          and sum(increase(agents_hub_model_cost_usd_total[1h]))
            > 3 * (sum(increase(agents_hub_model_cost_usd_total[1d] offset 1h)) / 24)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Agents Hub: spend in the last hour is over three times the daily average"
          description: "See the Costs page and docs/costs.md for budgets and the per-run cap."

      - alert: AgentsHubOutboxDead
        expr: agents_hub_outbox{state="dead"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Agents Hub: outbound deliveries were given up on"
          description: "See docs/runbook.md and docs/notifications.md."
