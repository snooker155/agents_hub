# Agents Hub for one person, from the published images. Nothing to clone and
# nothing to build: two files in an empty folder and one command.
#
#   mkdir agents-hub && cd agents-hub
#   curl -fsSLO https://raw.githubusercontent.com/snooker155/agents_hub/main/deploy/quickstart/docker-compose.yml
#   curl -fsSL  https://raw.githubusercontent.com/snooker155/agents_hub/main/deploy/quickstart/env.example -o .env
#   docker compose up -d
#
# or let the guided setup write the files and start the stack. From an empty
# folder, with only Docker installed:
#
#   docker run -it --rm --user 0:0 -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:$PWD" -w "$PWD" --add-host host.docker.internal:host-gateway ghcr.io/snooker155/agents-hub-backend:latest setup
#
# and from a folder that already has these two files:
#
#   docker compose run --rm setup
#
# Then open http://localhost:8080. Provider keys go into .env (see the file)
# or into Settings once the dashboard is up; both end up in the same file,
# which is bind mounted into the backend so the keys survive an upgrade.
#
# What runs: the backend (the API, with every agent as a subprocess inside
# it), the dashboard (nginx, which also proxies /api, so the CLI reaches the
# service at the same address: AGENTS_HUB_URL=http://localhost:8080) and the
# model runtime, which downloads local models (chat, speech, transcription)
# from Hugging Face and serves them (Models page, Local tab). State lives in
# the named volumes `agents_hub_data` and `models_data`.
#
#   docker compose pull && docker compose up -d      upgrade to the newest release
#   docker compose exec backend ah db backup --to /data/backups
#   docker compose down                              stop (the volume stays)
#   docker compose down -v                           stop and delete everything
#
# This is the single-user shape (docs/installation.md). Agents run as local
# subprocesses of the backend; the Docker socket is not mounted, so the
# per-agent containers, the docker sandbox and the browser service need the
# checkout-based compose file at the repository root instead
# (docs/deployment.md, "The shapes").

# What `backend-api` and `worker` (the `ha` profile) share: the published
# image, the state volume, the settings file and the model runtime token, as
# on `backend`. Kept as anchors so the two cannot drift apart.
x-hub: &hub
  image: ghcr.io/snooker155/agents-hub-backend:${AGENTS_HUB_TAG:-latest}
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  volumes:
    - agents_hub_data:/data
    - models_data:/models-data:ro
    - ./.env:/app/.env
  depends_on:
    init:
      condition: service_completed_successfully
    models:
      condition: service_started
    postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  networks:
    - default
    - browser_net

x-hub-env: &hub-env
  AGENT_EXECUTION_MODE: local
  AGENTS_HUB_ROOT: /data
  AGENTS_HUB_MODELS_URL: ${AGENTS_HUB_MODELS_URL:-http://models:8200}
  AGENTS_HUB_MODELS_TOKEN_FILE: /models-data/.token
  AGENTS_HUB_BROKER_URL: ${AGENTS_HUB_BROKER_URL:-redis://redis:6379/0}
  AGENTS_HUB_DATABASE_URL: ${AGENTS_HUB_DATABASE_URL:-postgresql://agents_hub:${POSTGRES_PASSWORD:-agents_hub}@postgres:5432/agents_hub}
  AGENTS_HUB_BLOB_URL: ${AGENTS_HUB_BLOB_URL:-}
  AGENTS_HUB_BLOB_ENDPOINT: ${AGENTS_HUB_BLOB_ENDPOINT:-}

services:
  # The image runs as an unprivileged user (uid 1000) and a fresh named
  # volume belongs to root, so this one-shot step hands the state directory
  # over before the backend starts. Idempotent.
  init:
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - agents_hub_data:/data

  backend:
    image: ghcr.io/snooker155/agents-hub-backend:${AGENTS_HUB_TAG:-latest}
    restart: unless-stopped
    environment:
      # Every agent runs as a subprocess of this container.
      AGENT_EXECUTION_MODE: local
      # The state directory (database, workspaces, run logs, views) on the
      # named volume rather than inside the image's layer.
      AGENTS_HUB_ROOT: /data
      # The model runtime below; its token is read from its volume.
      AGENTS_HUB_MODELS_URL: ${AGENTS_HUB_MODELS_URL:-http://models:8200}
      AGENTS_HUB_MODELS_TOKEN_FILE: /models-data/.token
    env_file:
      - path: .env
        required: false
    volumes:
      - agents_hub_data:/data
      - models_data:/models-data:ro
      # The file Settings writes provider keys into. Mounted from the host so
      # they outlive the container; the env.example next to this file is the
      # template.
      - ./.env:/app/.env
    depends_on:
      init:
        condition: service_completed_successfully
      # First, so the shared volume is made by the runtime, owned by its user
      # and holding its token, before the backend mounts it.
      models:
        condition: service_started
      # Only when the `postgres` profile is on (COMPOSE_PROFILES=postgres in
      # .env, which `ah setup` writes); otherwise the backend keeps SQLite on
      # the volume and this entry is skipped.
      postgres:
        condition: service_healthy
        required: false
    # `browser_net` is the network the `browser` service lives on alone; the
    # backend joins it so it can reach the browser and nothing else can.
    networks:
      - default
      - browser_net

  # Postgres instead of SQLite, under a profile so a plain `up` never starts
  # it. .env needs COMPOSE_PROFILES=postgres, POSTGRES_PASSWORD and
  # AGENTS_HUB_DATABASE_URL=postgresql://agents_hub:<password>@postgres:5432/agents_hub
  # (`ah setup` writes all three). No port is published.
  postgres:
    image: postgres:17-alpine
    profiles:
      - postgres
      - ha
      # Keycloak keeps its realm in a database of this server.
      - keycloak
    restart: unless-stopped
    environment:
      POSTGRES_USER: agents_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agents_hub}
      POSTGRES_DB: agents_hub
    volumes:
      - agents_hub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents_hub -d agents_hub"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The model runtime (deploy/models in the repository): llama.cpp for chat
  # models, Whisper, Piper and Kokoro for transcription and speech. It writes
  # its token to its volume on first start; the backend reads it from there.
  # CPU only; no port is published, only the backend talks to it.
  models:
    image: ghcr.io/snooker155/agents-hub-models:${AGENTS_HUB_TAG:-latest}
    restart: unless-stopped
    environment:
      MODELS_TOKEN: ${AGENTS_HUB_MODELS_TOKEN:-}
      MODELS_TOKEN_FILE: /models/.token
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models_data:/models
    init: true
    # Time to save the models' prompt cache slots to the volume on a stop.
    stop_grace_period: 60s
    mem_limit: ${MODELS_MEM_LIMIT:-8g}
    security_opt:
      - no-new-privileges:true

  frontend:
    image: ghcr.io/snooker155/agents-hub-frontend:${AGENTS_HUB_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      # Space-separated host:port list nginx balances /api over. Under the
      # `ha` profile set it to backend-api:8000 in .env, so it balances over
      # the api replicas instead of the single `backend`.
      BACKEND_SERVERS: ${BACKEND_SERVERS:-backend:8000}
    depends_on:
      backend:
        condition: service_healthy

  # ---- Keycloak, the bundled identity provider (profile `keycloak`) ----
  # For AUTH_MODE=multi with OIDC (docs/identity.md); `ah setup` writes the
  # realm file mounted below and the variables here. The hub reaches it server
  # side at http://keycloak:8080, the browser at KEYCLOAK_PUBLIC_URL. The
  # one-shot step first creates the `keycloak` database next to the hub's own,
  # since the postgres image only creates one.
  keycloak-db-init:
    image: postgres:17-alpine
    profiles:
      - keycloak
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-agents_hub}
    # `\gexec` runs the query result as SQL, which is how CREATE DATABASE is
    # made conditional: it has no IF NOT EXISTS. Safe on every `up`.
    entrypoint: >
      /bin/sh -c "
      echo \"SELECT 'CREATE DATABASE keycloak' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak')\\gexec\"
      | psql -h postgres -U agents_hub -d agents_hub
      "
    restart: "no"

  # No healthcheck: the Keycloak image ships neither curl nor wget, so there
  # is nothing to probe /health/ready with from inside it. Health is enabled
  # (KC_HEALTH_ENABLED) for an external probe on port 9000 of the container.
  # The admin password has no default: with it empty the bootstrap admin is
  # not created and the console stays locked until a value is set.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    profiles:
      - keycloak
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: agents_hub
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-agents_hub}
      # The address the browser sees. The hub's server side calls arrive on
      # another name (keycloak:8080), which the dynamic backchannel allows.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
    volumes:
      # Written by `ah setup`; imported on the first start only.
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---- The `ha` profile: several api replicas and workers ----
  #   COMPOSE_PROFILES=ha in .env (`ah setup` writes it), then `docker compose up -d`
  # Postgres, Redis and MinIO, two `backend-api` replicas that only queue
  # launches and two `worker` replicas that run them, all on the published
  # image. The default `backend` still starts (a profile only adds services);
  # set BACKEND_SERVERS=backend-api:8000 in .env so nginx balances over the
  # api replicas. .env also needs, as in the root compose file:
  #   AGENTS_HUB_DATABASE_URL, AGENTS_HUB_BROKER_URL=redis://redis:6379/0,
  #   AGENTS_HUB_BLOB_URL=s3://agents-hub/ and AGENTS_HUB_BLOB_ENDPOINT=http://minio:9000
  #   with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY equal to MINIO_ROOT_USER
  #   and MINIO_ROOT_PASSWORD. The defaults below match the bundled services.
  # The workers run agents as local subprocesses only: this file mounts no
  # Docker socket, so a worker never claims a launch that wants a container.
  redis:
    image: redis:7-alpine
    profiles:
      - scale
      - ha
    # A password only when REDIS_PASSWORD is set in .env; empty keeps the
    # open, network-private Redis. The shell test runs inside the container,
    # hence the doubled dollar signs: compose must not interpolate them
    # itself. The image's own entrypoint is called so redis-server still drops
    # to its unprivileged user.
    command:
      - sh
      - -c
      - 'if [ -n "$$REDIS_PASSWORD" ]; then exec docker-entrypoint.sh redis-server --requirepass "$$REDIS_PASSWORD"; fi; exec docker-entrypoint.sh redis-server'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    restart: unless-stopped

  # S3 compatible object store for AGENTS_HUB_BLOB_URL, so the replicas share
  # files without sharing a disk. No port is published.
  # pgsty/minio and pgsty/mc: the community fork's images, since MinIO stopped
  # publishing minio/minio and minio/mc (Docker Hub answers 404 for both).
  minio:
    image: pgsty/minio
    profiles:
      - ha
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agents_hub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-agents_hub_minio}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: creates the bucket AGENTS_HUB_BLOB_URL names and exits. Safe on
  # every `up`; the api and worker replicas wait for it.
  minio-init:
    image: pgsty/mc
    profiles:
      - ha
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-agents_hub} ${MINIO_ROOT_PASSWORD:-agents_hub_minio} &&
      mc mb --ignore-existing local/agents-hub
      "
    restart: "no"

  backend-api:
    <<: *hub
    profiles:
      - ha
    command: ["python", "-m", "uvicorn", "dashboard.backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *hub-env
      AGENTS_HUB_ROLE: api
      # Where this container's own processes (chat replicas, runs on a worker)
      # call the API back: backend-api publishes no host port in this profile.
      AGENTS_HUB_CALLBACK_URL: ${AGENTS_HUB_CALLBACK_URL:-http://backend-api:8000}
    # No host port: several replicas cannot share one, and nginx reaches them
    # all by the shared DNS name.
    deploy:
      replicas: 2

  # Claims the launches the api replicas queued (docs/workers.md). Runs the
  # module directly because the image has no `ah worker` entry point beyond
  # the wrapper; the image's HEALTHCHECK is disabled since a worker serves no
  # HTTP.
  worker:
    <<: *hub
    profiles:
      - ha
    command: ["python", "-m", "runtime.worker"]
    environment:
      <<: *hub-env
      AGENTS_HUB_ROLE: worker
      # Where this container's own processes (chat replicas, runs on a worker)
      # call the API back: backend-api publishes no host port in this profile.
      AGENTS_HUB_CALLBACK_URL: ${AGENTS_HUB_CALLBACK_URL:-http://backend-api:8000}
      AGENTS_HUB_WORKER_MODES: ${AGENTS_HUB_WORKER_MODES:-local}
      AGENTS_HUB_WORKER_CONCURRENCY: ${AGENTS_HUB_WORKER_CONCURRENCY:-4}
    healthcheck:
      disable: true
    deploy:
      replicas: 2

  # Headless Chromium for the browser_* tools (tools/browser.py). In .env:
  # COMPOSE_PROFILES=browser, AGENTS_HUB_BROWSER_URL=http://browser:3000 and
  # AGENTS_HUB_BROWSER_TOKEN=<a long random string>; the service refuses to
  # start without the token. No port is published. It sits alone on
  # `browser_net`, which only the backend joins, so a page cannot reach
  # postgres or anything else here; it also refuses loopback, private and
  # metadata addresses itself. Add an egress firewall rule on the host for a
  # hard guarantee.
  browser:
    image: ghcr.io/snooker155/agents-hub-browser:${AGENTS_HUB_TAG:-latest}
    profiles:
      - browser
    environment:
      BROWSER_TOKEN: ${AGENTS_HUB_BROWSER_TOKEN:-}
      BROWSER_MAX_SESSIONS: ${BROWSER_MAX_SESSIONS:-8}
      BROWSER_IDLE_TIMEOUT: ${BROWSER_IDLE_TIMEOUT:-300}
    networks:
      - browser_net
    init: true
    # Chromium uses /dev/shm heavily; Docker's 64 MB default crashes tabs.
    shm_size: "1gb"
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # The guided installer: `docker compose run --rm setup`. Under its own
  # profile so `up` never starts it. The folder is mounted at the same path
  # inside and out: the wizard starts a compose project through the socket,
  # and the daemon resolves that project's bind mounts on the host, where only
  # the real path exists. Root so it can write into the folder; it hands what
  # it wrote back to the folder's owner. host.docker.internal is how it
  # reaches the dashboard port the stack publishes on the host.
  setup:
    image: ghcr.io/snooker155/agents-hub-backend:${AGENTS_HUB_TAG:-latest}
    profiles:
      - setup
    command: ["setup"]
    user: "0:0"
    stdin_open: true
    tty: true
    restart: "no"
    working_dir: ${PWD}
    volumes:
      - ${PWD}:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AGENTS_HUB_SETUP_HOST_DIR: ${PWD}

  # HTTPS in front of the dashboard, under a profile so a plain `up` never
  # starts it. A phone needs HTTPS to install the dashboard as an app and to
  # let the assistant use the microphone (docs/pwa.md). Caddy gets and renews
  # a Let's Encrypt certificate for HUB_DOMAIN on its own; the domain's DNS
  # must point at this host and ports 80 and 443 must be reachable. In .env:
  # COMPOSE_PROFILES=https and HUB_DOMAIN=hub.example.com (add postgres to
  # the profiles list with a comma when that profile is on too).
  https:
    image: caddy:2-alpine
    profiles:
      - https
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", "${HUB_DOMAIN:-localhost}", "--to", "frontend:80"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The certificates, kept across restarts so Let's Encrypt is not asked again.
      - caddy_data:/data
    depends_on:
      - frontend

networks:
  browser_net:
    driver: bridge

volumes:
  agents_hub_data:
  # MinIO's object data, used only under the `ha` profile.
  minio_data:
  agents_hub_pg:
  models_data:
  caddy_data:
