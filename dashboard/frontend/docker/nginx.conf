# Agents Hub dashboard — production server.
#
# Two jobs: serve the built SPA with cache headers a browser can act on, and
# put /api in front of one or more backend replicas.
#
# The upstream and the API asset cache are generated at container start from
# BACKEND_SERVERS / API_ASSET_CACHE_SECONDS; see docker/20-agents-hub-config.sh.
# Both land in /etc/nginx/conf.d, so `upstream agents_hub_backend` and the
# proxy_cache zone are defined by the time this file is parsed.

server {
    # IPv4 only: a container without IPv6 makes a `listen [::]:80` bind fail at
    # startup, and nothing reaches this server over IPv6 anyway — Docker
    # publishes the port and forwards v6 traffic to it as v4.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Agents post workspace files and attachments through the dashboard, and
    # some of them are large. The backend enforces its own limits; nginx only
    # needs to stay out of the way.
    client_max_body_size 512m;

    # ---------- compression ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # File metadata (not contents) for the bundle, so every request for a
    # hashed asset does not re-stat it.
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    # ---------- probe ----------
    # The image healthcheck. Deliberately not /api/health: this answers
    # "is nginx serving?", independent of whether a backend is up.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------- API ----------
    location /api/ {
        proxy_pass http://agents_hub_backend;

        proxy_http_version 1.1;
        # Empty Connection + HTTP/1.1 keeps the upstream sockets pooled
        # (see `keepalive` in the generated upstream).
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agent runs and SSE streams both hold a response open for a long
        # time, and buffering would withhold SSE frames until the buffer
        # fills. The dev-server proxy streams by default; this matches it.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Nothing under /api is cached here by default: the dashboard reads
        # live state, so a stale 200 is worse than a slow one. The one
        # exception is the asset location below.
        proxy_cache off;

        # Retry another replica when one refuses or dies mid-idle. Only for
        # requests nginx knows were not delivered — never a half-sent POST,
        # so a run is not started twice.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # View assets (3D models, images, data files an agent generated) are plain
    # files served through the API, and the Studio re-requests them on every
    # render. This is the one API path worth a short shared cache; the TTL is
    # short because a view can be mutated in place.
    location ~ ^/api/views/[^/]+/assets/ {
        proxy_pass http://agents_hub_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        include /etc/nginx/conf.d/agents-hub-api-cache.inc;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # ---------- static bundle ----------
    # Vite fingerprints everything under /assets, so the file at a given URL
    # never changes and the browser never needs to ask again.
    location /assets/ {
        # One Cache-Control, written by hand: `expires` would add a second one
        # of its own, and `immutable` is the half that matters here.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Unhashed files from public/ — cached, but revalidated within the day. The
    # lookahead keeps this off /api, whose asset paths end in these extensions
    # too and are handled above.
    location ~* ^(?!/api/).*\.(svg|png|jpg|jpeg|gif|ico|webp|avif|woff2?|ttf|eot|glb|gltf)$ {
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
        try_files $uri =404;
    }

    # ---------- SPA ----------
    # index.html must never be cached: it is what points at the new hashed
    # bundle after a deploy. Everything that is not a file on disk falls
    # through to it, so client-side routes survive a reload.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
